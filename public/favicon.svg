  <g fill="#f6f1e9">
    <rect x="9"  y="28" width="6" height="11"/>
    <rect x="18" y="22" width="6" height="17"/>
    <rect x="27" y="16" width="6" height="23"/>
    <rect x="36" y="9"  width="3" height="30"/>
  </g>
</svg>
